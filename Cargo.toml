[package]
name = "sqlite3-partitioner"
version = "0.2.0"
edition = "2021"

[lib]
name = "partitioner"
path = "src/lib.rs"
crate-type=["cdylib"]
[features]
vec = []

[dependencies]
regex = "1.10.3"
sqlite3_ext = { git = "https://github.com/CGamesPlay/sqlite3_ext", rev = "03079ad5" }
chrono = { version = "0.4", features = ["unstable-locales", "serde"] }
serde = { version = "1.0", features = ["derive"] }
ron = "0.8"
sqlparser = {version = "0.44.0", features = ["serde"]}
[dev-dependencies]
sqlite3_ext = { git = "https://github.com/CGamesPlay/sqlite3_ext", rev = "03079ad5", features = ["with_rusqlite"] }
rusqlite = {version = "^0.28", features = ["column_decltype", "vtab", "bundled", "load_extension"]}
cargo-llvm-cov = "0.6.7"


[profile.release]
opt-level = 3
debug = false
strip = true
debug-assertions = false
overflow-checks = false
lto = true
incremental = false
codegen-units = 8
rpath = false
panic = "abort"


[profile.test]
inherits = "release"
